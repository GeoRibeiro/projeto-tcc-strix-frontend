<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="/css/criar-conta.css">
    <script src="/script.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Cupcam</title>
</head>
<body class="pagina-auth">
    <div class="tema tema-flutuante">
        <img src="/assets/modo-escuro.svg" alt="Alternar entre modo claro e escuro">
    </div>

    <main class="auth">
        <div class="auth-arte">
            <img src="/assets/mascote/mascote-ideia.png" alt="Mascote da Cupcam com uma ideia" class="auth-mascote">

            <a href="/index.html" class="auth-logo auth-logo-mobile">
                <img src="/assets/logo.png" alt="Logo da equipe Strix">
            </a>
        </div>

        <div class="auth-form">
            <a href="/index.html" class="auth-logo">
                <img src="/assets/logo.png" alt="Logo da equipe Strix">
            </a>

            <div class="auth-conteudo">
                <div class="auth-titulos">
                    <h2>Crie sua conta</h2>
                    <p>Criar sua conta para acompanhar suas aulas</p>
                </div>

                <form class="form-auth" novalidate>
                    <div class="campo">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Macarronada Molhada">
                    </div>

                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="nome@exemplo.com">
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>

                        <div class="campo-senha">
                            <input type="password" id="senha" name="senha" autocomplete="new-password" placeholder="••••••••">

                            <button type="button" class="mostrar-senha" data-alvo="senha" aria-label="Mostrar senha">
                                <i class="ph ph-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="botao-auth">Criar Conta</button>
                </form>
            </div>

            <p class="auth-rodape">Já tem uma conta? <a href="/html/login.html">Login</a></p>
        </div>
    </main>
</body>
</html>
